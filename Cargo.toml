[package]
name = "lemonade-ori-harness"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/festeraeb/lemonade-ori-harness"
description = "Standalone Ori Harness for Lemonade: flag-driven mode shifting, MCP surface layer, subagent dispatch, and challenge scorecards."

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[[bin]]
name = "lemonade-ori"
path = "src/main.rs"
